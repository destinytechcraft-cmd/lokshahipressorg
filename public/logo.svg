<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circular Emblem (Completely Transparent Outside the Red Ring) -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />
  <circle cx="250" cy="250" r="234" stroke="#D81A28" strokeWidth="12" fill="none" />

  <!-- 4 Quadrant Segment Cards -->
  <g>
    <!-- Top White Segment with Red Border -->
    <path d="M 102.7 97.5 A 212 212 0 0 1 397.3 97.5 L 346.6 150.8 A 138 138 0 0 0 153.4 150.8 Z" fill="#FFFFFF" stroke="#D81A28" strokeWidth="3.5" />
    <!-- Left Saffron/Orange Segment -->
    <path d="M 97.5 397.3 A 212 212 0 0 1 97.5 102.7 L 150.8 153.4 A 138 138 0 0 0 150.8 346.6 Z" fill="#EA580C" stroke="#FFFFFF" strokeWidth="3.5" />
    <!-- Right Green Segment -->
    <path d="M 402.5 102.7 A 212 212 0 0 1 402.5 397.3 L 349.2 346.6 A 138 138 0 0 0 349.2 153.4 Z" fill="#1E8626" stroke="#FFFFFF" strokeWidth="3.5" />
    <!-- Bottom Blue Segment -->
    <path d="M 397.3 402.5 A 212 212 0 0 1 102.7 402.5 L 153.4 349.2 A 138 138 0 0 0 346.6 349.2 Z" fill="#2252A7" stroke="#FFFFFF" strokeWidth="3.5" />
  </g>

  <!-- Arched Typography matching official emblem -->
  <!-- Top: PATRAKAR in Red -->
  <g fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontWeight="900" fontSize="27" fill="#D81A28" textAnchor="middle" dominantBaseline="central">
    <text x="159.9" y="100.0" transform="rotate(-31.0, 159.9, 100.0)">P</text>
    <text x="184.0" y="87.9" transform="rotate(-22.1, 184.0, 87.9)">A</text>
    <text x="209.8" y="79.7" transform="rotate(-13.3, 209.8, 79.7)">T</text>
    <text x="236.5" y="75.5" transform="rotate(-4.4, 236.5, 75.5)">R</text>
    <text x="263.5" y="75.5" transform="rotate(4.4, 263.5, 75.5)">A</text>
    <text x="290.2" y="79.7" transform="rotate(13.3, 290.2, 79.7)">K</text>
    <text x="316.0" y="87.9" transform="rotate(22.1, 316.0, 87.9)">A</text>
    <text x="340.1" y="100.0" transform="rotate(31.0, 340.1, 100.0)">R</text>
  </g>

  <!-- Left: LOKSHAHI in White -->
  <g fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontWeight="900" fontSize="26" fill="#FFFFFF" textAnchor="middle" dominantBaseline="central">
    <text x="101.6" y="342.7" transform="rotate(58.0, 101.6, 342.7)">L</text>
    <text x="88.7" y="318.0" transform="rotate(67.1, 88.7, 318.0)">O</text>
    <text x="80.0" y="291.5" transform="rotate(76.3, 80.0, 291.5)">K</text>
    <text x="75.6" y="263.9" transform="rotate(85.4, 75.6, 263.9)">S</text>
    <text x="75.6" y="236.1" transform="rotate(94.6, 75.6, 236.1)">H</text>
    <text x="80.0" y="208.5" transform="rotate(103.7, 80.0, 208.5)">A</text>
    <text x="88.7" y="182.0" transform="rotate(112.9, 88.7, 182.0)">H</text>
    <text x="101.6" y="157.3" transform="rotate(122.0, 101.6, 157.3)">I</text>
  </g>

  <!-- Right: MAHASANGH in White -->
  <g fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontWeight="900" fontSize="24" fill="#FFFFFF" textAnchor="middle" dominantBaseline="central">
    <text x="396.8" y="154.7" transform="rotate(-123.0, 396.8, 154.7)">M</text>
    <text x="408.9" y="176.7" transform="rotate(-114.8, 408.9, 176.7)">A</text>
    <text x="417.8" y="200.3" transform="rotate(-106.5, 417.8, 200.3)">H</text>
    <text x="423.2" y="224.9" transform="rotate(-98.2, 423.2, 224.9)">A</text>
    <text x="425.0" y="250.0" transform="rotate(-90.0, 425.0, 250.0)">S</text>
    <text x="423.2" y="275.1" transform="rotate(-81.8, 423.2, 275.1)">A</text>
    <text x="417.8" y="299.7" transform="rotate(-73.5, 417.8, 299.7)">N</text>
    <text x="408.9" y="323.3" transform="rotate(-65.2, 408.9, 323.3)">G</text>
    <text x="396.8" y="345.3" transform="rotate(-57.0, 396.8, 345.3)">H</text>
  </g>

  <!-- Bottom: BHARAT in White -->
  <g fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontWeight="900" fontSize="29" fill="#FFFFFF" textAnchor="middle" dominantBaseline="central">
    <text x="178.8" y="409.9" transform="rotate(24.0, 178.8, 409.9)">B</text>
    <text x="206.5" y="419.5" transform="rotate(14.4, 206.5, 419.5)">H</text>
    <text x="235.4" y="424.4" transform="rotate(4.8, 235.4, 424.4)">A</text>
    <text x="264.6" y="424.4" transform="rotate(-4.8, 264.6, 424.4)">R</text>
    <text x="293.5" y="419.5" transform="rotate(-14.4, 293.5, 419.5)">A</text>
    <text x="321.2" y="409.9" transform="rotate(-24.0, 321.2, 409.9)">T</text>
  </g>

  <!-- Center White Disc -->
  <circle cx="250" cy="250" r="132" fill="#FFFFFF" />
  <!-- Tricolor Arc at the top of Center Disc -->
  <path d="M 172 250 A 122 122 0 0 1 247 128" stroke="#EA580C" strokeWidth="6" strokeLinecap="round" fill="none" />
  <path d="M 253 128 A 122 122 0 0 1 328 250" stroke="#1E8626" strokeWidth="6" strokeLinecap="round" fill="none" />

  <!-- Central Emblem: Microphone + Clenched Fist + Pen Nib -->
  <g transform="translate(250, 250)">
    <!-- 1. The Microphone (tilted at -28 degrees) -->
    <g transform="rotate(-28) translate(0, -96)">
      <!-- Mic Grill Dome -->
      <ellipse cx="0" cy="18" rx="20" ry="21" fill="#18181A" />
      <path d="M -13 11 Q 0 3 13 11" stroke="#FFFFFF" strokeWidth="1.8" fill="none" opacity="0.85" />
      <path d="M -18 18 Q 0 9 18 18" stroke="#FFFFFF" strokeWidth="1.8" fill="none" opacity="0.85" />
      <path d="M -13 25 Q 0 17 13 25" stroke="#FFFFFF" strokeWidth="1.8" fill="none" opacity="0.85" />
      <line x1="0" y1="-2" x2="0" y2="38" stroke="#FFFFFF" strokeWidth="1.5" opacity="0.75" />
      <!-- Red Band Under Grill -->
      <rect x="-18" y="29" width="36" height="7" rx="2" fill="#D81A28" />
      <!-- Microphone Station Box (Flag) with LPMI -->
      <polygon points="-25,36 25,36 20,66 -20,66" fill="#D81A28" stroke="#18181A" strokeWidth="1.8" />
      <text x="0" y="55" fill="#FFFFFF" fontSize="13" fontWeight="900" letterSpacing="1" textAnchor="middle" fontFamily="system-ui, -apple-system, sans-serif">LPMI</text>
      <!-- Mic Handle Going Through Fist -->
      <rect x="-6" y="66" width="12" height="72" rx="3" fill="#18181A" />
    </g>

    <!-- 2. The Clenched Fist (Solid Red with Clean White Knuckle/Muscle Lines) -->
    <g>
      <!-- Base Hand Silhouette -->
      <path d="M -23 -32 C -36 -28 -40 -10 -35 8 C -31 22 -33 34 -25 44 L -18 48 L 18 48 L 25 44 C 33 34 31 22 35 8 C 40 -10 36 -28 23 -32 Z" fill="#D81A28" />

      <!-- Fingers Clenched Around Handle (4 stacked finger loops) -->
      <!-- Top / Index Finger -->
      <path d="M -16 -28 C -5 -32 15 -32 24 -24 C 28 -20 28 -14 22 -12 C 16 -10 2 -12 -12 -12" fill="#D81A28" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />
      <!-- Second / Middle Finger -->
      <path d="M -18 -16 C -6 -20 18 -20 26 -12 C 30 -8 29 -2 22 0 C 15 2 2 -1 -14 -1" fill="#D81A28" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />
      <!-- Third / Ring Finger -->
      <path d="M -18 -4 C -6 -8 18 -8 25 0 C 29 4 28 10 21 12 C 15 14 2 11 -14 11" fill="#D81A28" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />
      <!-- Bottom / Pinky Finger -->
      <path d="M -16 8 C -6 4 16 4 23 11 C 27 15 26 21 19 23 C 13 25 2 22 -12 22" fill="#D81A28" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />

      <!-- Thumb Locked Over Fingers on Left -->
      <path d="M -24 -22 C -34 -14 -32 2 -20 8 L -12 4 C -18 -2 -18 -14 -24 -22 Z" fill="#D81A28" stroke="#FFFFFF" strokeWidth="2" strokeLinejoin="round" />

      <!-- Palm & Wrist Muscular Contour Highlights -->
      <path d="M -10 26 Q -4 36 -7 46" fill="none" stroke="#FFFFFF" strokeWidth="2.4" strokeLinecap="round" />
      <path d="M 0 27 Q 4 37 2 46" fill="none" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />
      <path d="M 10 26 Q 6 36 8 46" fill="none" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />
    </g>

    <!-- 3. The Fountain Pen Nib (Extending Down from the Wrist) -->
    <path d="M -18 46 L -26 66 L 0 110 L 26 66 L 18 46 Z" fill="#D81A28" stroke="#C0101E" strokeWidth="1.5" />
    <path d="M -22 66 L -2 104" stroke="#FFFFFF" strokeWidth="1.8" opacity="0.65" strokeLinecap="round" />
    <path d="M 22 66 L 2 104" stroke="#FFFFFF" strokeWidth="1.8" opacity="0.65" strokeLinecap="round" />
    <circle cx="0" cy="78" r="4.5" fill="#18181A" />
    <line x1="0" y1="78" x2="0" y2="110" stroke="#18181A" strokeWidth="3" strokeLinecap="round" />
    <circle cx="0" cy="110" r="3" fill="#18181A" />
  </g>
</svg>
